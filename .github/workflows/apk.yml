name: Build APK
on:
  push:
    branches: [main, master]
    paths-ignore: ['www/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Fullscreen patch
        run: |
          cat > android/app/src/main/java/com/gymdiary/app/MainActivity.java <<'EOF'
          package com.gymdiary.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              hideBars();
            }
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }
            private void hideBars() {
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          EOF
      - name: Notification permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: App icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import glob,os
          a=Image.open('icon.png').convert('RGB');f=Image.open('icon-fg.png').convert('RGB')
          sz={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d,n in sz.items():
              m='android/app/src/main/res/mipmap-'+d
              for nm in ('ic_launcher.png','ic_launcher_round.png'):
                  a.resize((n,n),Image.LANCZOS).save(m+'/'+nm)
              f.resize((n*108//48,n*108//48),Image.LANCZOS).save(m+'/ic_launcher_foreground.png')
          for x in glob.glob('android/app/src/main/res/values/ic_launcher_background.xml'):
              open(x,'w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#05070E</color></resources>')
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gym-diary-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
